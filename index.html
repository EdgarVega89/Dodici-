<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#66717b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dodici Console">
  <title>Dodici Manager Console</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/logo.jpeg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header class="mobile-header">
    <img src="/assets/logo.jpeg" alt="Dodici">
    <nav id="mobileNav"></nav>
  </header>

  <aside class="sidebar">
    <div class="logo-card"><img src="/assets/logo.jpeg" alt="Dodici Pizza & Wine"></div>
    <nav id="desktopNav"></nav>
  </aside>

  <main class="main">
    <div id="alertBar" class="alert-bar"></div>
    <section id="view"></section>
  </main>
</div>

<div id="modal" class="modal" aria-hidden="true"></div>
<div id="toast" class="toast"></div>

<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
